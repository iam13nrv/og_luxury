
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OG LUXURY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f6f3;color:#171717;font-family:Arial,sans-serif}
header{background:#111;color:white;text-align:center;padding:28px 12px}
.logo{font-size:28px;letter-spacing:6px;font-weight:bold}
.sub{font-size:10px;letter-spacing:4px;color:#c8b68c;margin-top:8px}
nav{display:flex;overflow:auto;gap:8px;background:white;padding:13px}
nav button{padding:10px 13px;border:1px solid #ddd;background:white;white-space:nowrap}
nav button.active{background:#111;color:white}
main{max-width:1100px;margin:auto;padding:18px 12px}
h1{font-size:23px;font-weight:500}
.intro{color:#777;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;cursor:pointer}
.photo{aspect-ratio:4/5;background:#e9e6e0;display:flex;align-items:center;justify-content:center;color:#888;font-size:11px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:11px}
.brand{font-size:10px;letter-spacing:2px;color:#8c7953}
.name{font-size:14px;margin:7px 0}
.ref,.sizes{font-size:11px;color:#777;margin-top:6px}
#detail{display:none;background:white;padding:14px}
#detail.show{display:block}
.back{padding:10px;border:0;background:#eee;margin-bottom:15px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery .photo{aspect-ratio:3/4}
#detail h2{font-size:22px;font-weight:500}
#detail p{font-size:14px;line-height:1.6;color:#555}
.size-list{display:flex;flex-wrap:wrap;gap:8px}
.size-chip{border:1px solid #ddd;padding:9px 12px;font-size:12px}
footer{text-align:center;padding:30px;color:#888;font-size:10px;letter-spacing:3px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}main{padding:30px}}
@media(min-width:950px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
<div class="logo">OG LUXURY</div>
<div class="sub">DIGITAL CATALOGUE</div>
</header>
<nav id="brands"></nav>
<main>
<h1 id="heading">Nos collections</h1>
<div class="intro">Découvrez nos articles, références et tailles disponibles.</div>
<section id="catalogue" class="grid"></section>
<section id="detail"></section>
</main>
<footer>OG LUXURY · COLLECTIONS</footer>
<script>
const products=[
{brand:"Louis Vuitton",name:"Article à personnaliser",ref:"OG-LV-001",sizes:["Unique"],description:"Ajoutez ici la description de cet article.",photos:["","",""]},
{brand:"Nike",name:"Sneakers à personnaliser",ref:"OG-NK-001",sizes:["40","41","42","43","44"],description:"Ajoutez ici la description de cet article.",photos:["","",""]},
{brand:"Stone Island",name:"Vêtement à personnaliser",ref:"OG-SI-001",sizes:["S","M","L","XL"],description:"Ajoutez ici la description de cet article.",photos:["","",""]},
{brand:"New Balance",name:"Sneakers à personnaliser",ref:"OG-NB-001",sizes:["40","41","42","43","44"],description:"Ajoutez ici la description de cet article.",photos:["","",""]}
];
const brands=["Toutes","Louis Vuitton","Nike","Stone Island","New Balance"];
let selected="Toutes";
const nav=document.getElementById("brands");
const catalogue=document.getElementById("catalogue");
const detail=document.getElementById("detail");
const heading=document.getElementById("heading");

function photo(url,label){
const box=document.createElement("div");
box.className="photo";
if(url){const img=document.createElement("img");img.src=url;img.alt=label;box.appendChild(img)}
else{box.textContent="PHOTO À AJOUTER"}
return box;
}
function renderNav(){
nav.innerHTML="";
brands.forEach(b=>{
const btn=document.createElement("button");
btn.textContent=b;
btn.className=b===selected?"active":"";
btn.onclick=()=>{selected=b;detail.style.display="none";detail.classList.remove("show");catalogue.style.display="grid";renderNav();renderProducts()};
nav.appendChild(btn);
});
}
function renderProducts(){
heading.textContent=selected==="Toutes"?"Nos collections":selected;
catalogue.innerHTML="";
const list=products.filter(p=>selected==="Toutes"||p.brand===selected);
list.forEach(p=>{
const card=document.createElement("article");card.className="card";
card.appendChild(photo(p.photos[0],p.name));
const info=document.createElement("div");info.className="info";
const brand=document.createElement("div");brand.className="brand";brand.textContent=p.brand.toUpperCase();
const name=document.createElement("div");name.className="name";name.textContent=p.name;
const ref=document.createElement("div");ref.className="ref";ref.textContent="Réf. "+p.ref;
const sizes=document.createElement("div");sizes.className="sizes";sizes.textContent="Tailles : "+p.sizes.join(" · ");
info.append(brand,name,ref,sizes);card.appendChild(info);
card.onclick=()=>showDetail(p);catalogue.appendChild(card);
});
}
function showDetail(p){
catalogue.style.display="none";heading.textContent=p.brand;
detail.innerHTML="";detail.style.display="block";detail.classList.add("show");
const back=document.createElement("button");back.className="back";back.textContent="← Retour au catalogue";
back.onclick=()=>{detail.style.display="none";detail.classList.remove("show");catalogue.style.display="grid";renderProducts()};
detail.appendChild(back);
const gallery=document.createElement("div");gallery.className="gallery";
p.photos.forEach((url,i)=>gallery.appendChild(photo(url,p.name+" "+(i+1))));
const brand=document.createElement("div");brand.className="brand";brand.textContent=p.brand.toUpperCase();
const title=document.createElement("h2");title.textContent=p.name;
const ref=document.createElement("p");ref.textContent="Référence : "+p.ref;
const desc=document.createElement("p");desc.textContent=p.description;
const label=document.createElement("p");label.textContent="Tailles disponibles";
const sizes=document.createElement("div");sizes.className="size-list";
p.sizes.forEach(s=>{const chip=document.createElement("span");chip.className="size-chip";chip.textContent=s;sizes.appendChild(chip)});
detail.append(gallery,brand,title,ref,desc,label,sizes);
window.scrollTo(0,0);
}
renderNav();renderProducts();
</script>
</body>
                                       </html>
